name: Claude
on:
  issues:
    types: [labeled]

permissions:            # a reusable workflow can't be granted more than its
  contents: write       # caller; the repo's default GITHUB_TOKEN is read-only,
  pull-requests: write  # so omitting this fails the run at startup_failure.
  issues: write

jobs:
  claude:
    if: github.event.label.name == 'ai-implement'
    uses: freaxnx01/agent-workflow/.github/workflows/agent-implement.yml@v2
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    with:
      issue-number: ${{ github.event.issue.number }}
      runner-labels: '["ubuntu-latest"]'
      default-model: claude-sonnet-5
      pipeline-ref: v2
      # The agent's own wall-clock cap, distinct from the job's. It defaults to
      # 10 minutes, which was harmless only while the pipeline was dropping it
      # on the floor (agent-workflow#341, fixed in v2.0.5) — now that it applies,
      # 10 is demonstrably too low: the run on #16 was still doing useful work
      # at 27 minutes before it was cancelled. Every plan in this repo asks for
      # headless Playwright verification, and the 184 MB browser download comes
      # out of the same budget. Kept under the job's 30-minute cap so the agent
      # is stopped first and the run still reports a result.
      # Revisit if agent-workflow#311 raises the upstream default.
      claude-timeout-minutes: 25
