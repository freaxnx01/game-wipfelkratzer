name: Claude
on:
  issues:
    types: [labeled]

permissions:            # a reusable workflow can't be granted more than its
  contents: write       # caller; the repo's default GITHUB_TOKEN is read-only,
  pull-requests: write  # so omitting this fails the run at startup_failure.
  issues: write

jobs:
  claude:
    if: github.event.label.name == 'ai-implement'
    uses: freaxnx01/agent-workflow/.github/workflows/agent-implement.yml@v2
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    with:
      issue-number: ${{ github.event.issue.number }}
      runner-labels: '["ubuntu-latest"]'
      default-model: claude-sonnet-5
      pipeline-ref: v2
      # Three `## ai-implement run` reports on #17 are artefacts of the broken
      # @v1 pipeline (no git identity on the runner, classify-turns.sh absent),
      # not attempts at the problem. The cap counts reports and cannot be told
      # they were infra failures — agent-workflow#321. Raised so #17 gets two
      # real attempts against @v2; drop back to the default once #321 lands.
      max-attempts: 5
